site_name: CAMS - Tài liệu hướng dẫn
site_description: Tài liệu hướng dẫn cài đặt và sử dụng phần mềm CAMS
site_author: Nhóm phát triển CAMS
site_url: https://viet15t12.github.io/CAMS/

repo_name: viet15t12/CAMS
repo_url: https://github.com/viet15t12/CAMS
edit_uri: edit/main/00_book/

docs_dir: 00_book
site_dir: site

nav:
  - Trang chủ: index.md
  - Hướng dẫn sử dụng:
      - Lời mở đầu: DOC/00_loi_mo_dau.md
      - "Chương 1 · Tổng quan": DOC/01_tong_quan.md
      - "Chương 2 · Cài đặt và bắt đầu sử dụng": DOC/02_cai_dat_su_dung.md
      - "Chương 3 · Giao diện và điều hướng": DOC/03_giao_dien_dieu_huong.md
      - "Chương 4 · Quản lý thiết bị": DOC/04_quan_ly_thiet_bi.md

# Giữ mã nguồn Typst trong 00_book nhưng không đưa các file đó lên website.
# Các file Markdown được xuất bản được sắp xếp trong mục nav phía trên.
exclude_docs: |
  **/*.typ
  config/**
  cover/**

theme:
  name: material
  language: vi
  logo: figures/icons/logo.svg
  favicon: figures/icons/logo.svg
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
    - toc.follow
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Chuyển sang giao diện tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Chuyển sang giao diện sáng

plugins:
  - search:
      lang: vi

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lightbox.js

copyright: Copyright &copy; Nhóm phát triển CAMS
