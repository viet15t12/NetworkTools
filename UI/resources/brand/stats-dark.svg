<svg
    width="100%"
    height="16"
    viewBox="0 0 1240 16"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#2f81f7" stop-opacity="0" />
            <stop offset="0.35" stop-color="#2f81f7" stop-opacity="0.95" />
            <stop offset="0.65" stop-color="#e3772f" stop-opacity="0.95" />
            <stop offset="1"    stop-color="#e3772f" stop-opacity="0" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Đường nền -->
    <rect x="60" y="7" width="1120" height="2" rx="1" fill="#30363d" opacity="0.55" />

    <!-- Vệt sáng chạy qua lại (ping-pong), xanh lam -> cam -->
    <rect y="6" width="220" height="4" rx="2" fill="url(#sweep)" filter="url(#glow)">
        <animate
            attributeName="x"
            values="-220;1240;-220"
            keyTimes="0;0.5;1"
            dur="4.4s"
            repeatCount="indefinite"
        />
    </rect>
</svg>