[project]
name = "networktools"
version = "0.2"
description = "PyQt6/QML desktop application for network device configuration workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- GIAO DIEN PYQT6/QML ---
    "pyqt6>=6.7,<6.11",
    "psutil>=6.0.0",
    # Authenticated AES-256-GCM + Argon2id for optional .ntp protection.
    "cryptography>=46,<50",
    # ORM gon cho cac thao tac CRUD/lifecycle SQLite co cau truc on dinh.
    "peewee>=3.17,<4",
    # --- KET NOI VA TUONG TAC THIET BI MANG (SSH / NETCONF) ---
    "netmiko>=4.7.0",
    "paramiko>=3.5.0,<5.0",
    "scp>=0.15.0,<0.16",
    # Temporary compatibility dependency for the inactive embedded-terminal path.
    "pyte>=0.8.2,<0.9",
    # Temporary compatibility dependency; active composition uses the companion app.
    "qtpyterminal==0.1",
    "ncclient>=0.6.13",
    # --- THU VIEN DIEU PHOI DA LUONG (NORNIR FRAMEWORK) ---
    "nornir>=3.3.0",
    "nornir-netmiko>=1.0.1",
    # --- TUONG TAC API (RESTCONF) ---
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    # --- XU LY TEMPLATE VA DU LIEU CAU HINH ---
    "Jinja2>=3.1.2",
    "PyYAML>=6.0.1",
    "pyshark",
    "scapy",
    "napalm",
    # --- LUU PHIEN BAN RUNNING-CONFIG BANG GIT NOI BO ---
    "dulwich>=0.24,<0.26",
]

[project.optional-dependencies]
speed = [
    "Cython>=3.0,<4.0",
    "setuptools>=69",
]

[tool.uv.sources]
qtpyterminal = { path = "qtpyTerminal-main" }

[project.scripts]
networktools = "main:main"
